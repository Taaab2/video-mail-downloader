name: הורדת סרטונים

# שלוש הרצות:
#   1. download – הורדת סרטון אחד או כמה (נבחרים מרשימה), מופעל מהתוסף.
#   2. list     – שליפת רשימת הסרטונים מפלייליסט/ערוץ (בלי להוריד) עבור בחירה.
#   3. cleanup  – פעם ביום מוחק הורדות (Releases) בנות יותר מ-24 שעות.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "מצב הפעולה"
        type: choice
        default: download
        options: [download, list]
      url:
        description: "קישור לסרטון / פלייליסט / ערוץ"
        type: string
        default: ""
      urls:
        description: "כמה קישורים להורדה (שורה לכל קישור) – לבחירה מרשימה"
        type: string
        default: ""
      whole:
        description: "להוריד את כל הסרטונים שבערוץ/פלייליסט"
        type: boolean
        default: false
      limit:
        description: "תקרה למספר הסרטונים במצב ערוץ שלם (ריק = ברירת מחדל)"
        type: string
        default: ""
      quality:
        description: "איכות ההורדה"
        type: choice
        default: best
        options: [best, 1080p, 720p, 480p, 360p, audio]
      cleanup:
        description: "לנקות הורדות ישנות בלבד (בלי להוריד סרטון)"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *" # ניקוי יומי בשעה 03:00 UTC

permissions:
  contents: write # נדרש ליצירת Releases, העלאת קבצים ומחיקתם

concurrency:
  group: downloader
  cancel-in-progress: false

jobs:
  list:
    name: שליפת רשימת סרטונים
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'list' && inputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}

    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: התקנת Deno (נדרש לחילוץ מ-YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: התקנת yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r scripts/requirements.txt
          yt-dlp --version

      - name: שליפת רשימת הסרטונים ופרסומה
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          python scripts/download.py --list --json --url "$INPUT_URL"

  download:
    name: הורדה
    if: |
      github.event_name == 'workflow_dispatch' && inputs.mode != 'list' &&
      (inputs.url != '' || inputs.urls != '')
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # עוגיות יוטיוב טריות (base64 של cookies.txt, אולי gzip) – נכתבות בכל הורדה מהתוסף
      YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}

    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: התקנת Deno (נדרש לחילוץ מ-YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: התקנת yt-dlp ו-ffmpeg (תמיד)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          python -m pip install --upgrade pip
          pip install --upgrade -r scripts/requirements.txt
          yt-dlp --version

      - name: הורדת הסרטונים ופרסום ב-Release
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_URLS: ${{ inputs.urls }}
          INPUT_QUALITY: ${{ inputs.quality }}
          INPUT_WHOLE: ${{ inputs.whole }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--json)
          if [ -n "$INPUT_QUALITY" ]; then ARGS+=(--quality "$INPUT_QUALITY"); fi
          if [ "$INPUT_WHOLE" = "true" ]; then ARGS+=(--whole); fi
          if [ -n "$INPUT_LIMIT" ]; then ARGS+=(--limit "$INPUT_LIMIT"); fi
          if [ -n "$INPUT_URL" ]; then ARGS+=(--url "$INPUT_URL"); fi
          if [ -n "$INPUT_URLS" ]; then
            while IFS= read -r line; do
              line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -n "$line" ] && ARGS+=(--url "$line")
            done <<< "$INPUT_URLS"
          fi
          echo "מריץ הורדה עם ${#ARGS[@]} ארגומנטים"
          python scripts/download.py "${ARGS[@]}"

  cleanup:
    name: ניקוי הורדות ישנות
    if: github.event_name == 'schedule' || inputs.cleanup == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת התלויות
        run: pip install -r scripts/requirements.txt

      - name: מחיקת הורדות בנות יותר מ-24 שעות
        run: python scripts/cleanup_releases.py
