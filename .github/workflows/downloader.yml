name: הורדת סרטונים

# שתי הרצות:
#   1. הורדה – מופעלת ידנית מהתוסף (או מהאתר) עם קישור ואיכות.
#   2. ניקוי – פעם ביום מוחק הורדות (Releases) בנות יותר מ-24 שעות.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "קישור לסרטון"
        type: string
        default: ""
      quality:
        description: "איכות ההורדה"
        type: choice
        default: best
        options: [best, 1080p, 720p, 480p, 360p, audio]
      cleanup:
        description: "לנקות הורדות ישנות בלבד (בלי להוריד סרטון)"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *" # ניקוי יומי בשעה 03:00 UTC

permissions:
  contents: write # נדרש ליצירת Releases, העלאת קבצים ומחיקתם

concurrency:
  group: downloader
  cancel-in-progress: false

jobs:
  download:
    name: הורדה
    if: github.event_name == 'workflow_dispatch' && inputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # עוגיות יוטיוב טריות (base64 של cookies.txt, אולי gzip) – נכתבות בכל הורדה מהתוסף
      YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}

    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: התקנת Deno (נדרש לחילוץ מ-YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: התקנת yt-dlp ו-ffmpeg (תמיד)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          python -m pip install --upgrade pip
          pip install --upgrade -r scripts/requirements.txt
          yt-dlp --version

      - name: הורדת הסרטון ופרסום ב-Release
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_QUALITY: ${{ inputs.quality }}
        run: |
          ARGS=(--url "$INPUT_URL")
          if [ -n "$INPUT_QUALITY" ]; then ARGS+=(--quality "$INPUT_QUALITY"); fi
          echo "מריץ: python scripts/download.py ${ARGS[*]}"
          python scripts/download.py "${ARGS[@]}"

  cleanup:
    name: ניקוי הורדות ישנות
    if: github.event_name == 'schedule' || inputs.cleanup == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת התלויות
        run: pip install -r scripts/requirements.txt

      - name: מחיקת הורדות בנות יותר מ-24 שעות
        run: python scripts/cleanup_releases.py
